name: Build 3105 (unsigned .app for eSign)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (no signing)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/3105.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Create unsigned .app
        run: |
          set -euo pipefail
          APP_DIR="build/3105.xcarchive/Products/Applications/3105.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "App bundle not found. Listing available apps:"
            ls build/3105.xcarchive/Products/Applications/
            exit 1
          fi
          mkdir -p build/3105-app
          cp -r "$APP_DIR" build/3105-app/
          cd build/3105-app
          # Zip .app nhưng để Info.plist ở root để eSign/AltStore nhận diện
          zip -r 3105-unsigned.app.zip 3105.app

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-app
          path: build/3105-app/3105-unsigned.app.zip
          if-no-files-found: error