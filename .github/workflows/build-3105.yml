name: Build 3105

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/3105.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_DIR="build/3105.xcarchive/Products/Applications/3105.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "App bundle not found. Listing available apps:"
            ls build/3105.xcarchive/Products/Applications/
            exit 1
          fi
          mkdir -p build/ipa
          cp -r "$APP_DIR" build/ipa/
          cd build/ipa
          zip -r 3105-unsigned.ipa 3105.app
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error