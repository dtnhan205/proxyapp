name: Build 3105

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (no signing)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/3105.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA (Payload/3105.app structure)
        run: |
          set -euo pipefail
          APP_DIR="build/3105.xcarchive/Products/Applications/3105.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "App bundle not found. Listing available apps:"
            ls build/3105.xcarchive/Products/Applications/
            exit 1
          fi
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -r "$APP_DIR" build/ipa/Payload/
          cd build/ipa
          zip -r 3105.ipa Payload
          ls -la
          echo "---"
          unzip -l 3105.ipa | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ipa
          path: build/ipa/3105.ipa
          if-no-files-found: error