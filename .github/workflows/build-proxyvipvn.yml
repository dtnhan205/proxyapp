name: Build ProxyVipVn

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (no signing)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ProxyVipVn \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ProxyVipVn.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA (Payload/ProxyVipVn.app structure)
        run: |
          set -euo pipefail
          APP_DIR="build/ProxyVipVn.xcarchive/Products/Applications/ProxyVipVn.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "App bundle not found. Listing available apps:"
            ls build/ProxyVipVn.xcarchive/Products/Applications/
            exit 1
          fi
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -r "$APP_DIR" build/ipa/Payload/
          cd build/ipa
          zip -r ProxyVipVn.ipa Payload
          ls -la
          echo "---"
          unzip -l ProxyVipVn.ipa | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyVipVn-ipa
          path: build/ipa/ProxyVipVn.ipa
          if-no-files-found: error
