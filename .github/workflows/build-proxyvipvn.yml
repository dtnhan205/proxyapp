name: Build ProxyVipVn

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'AppNew/ThreeOneOSFive/**'
      - 'AppNew/ThreeOneOSFive.xcodeproj/**'
      - 'tools/**'
      - '.github/workflows/build-proxyvipvn.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Show runner info
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/checkout@v4

      # Cache DerivedData của Xcode để giảm thời gian build từ ~5 phút
      # (cold) xuống ~1-2 phút (warm). Key dựa trên hash của:
      #   - .xcodeproj/project.pbxproj (build settings thay đổi → re-cache)
      #   - toàn bộ source files (Swift/ObjC/C/Headers/Info.plist)
      # Cache lưu trong ~/Library/Developer/Xcode/DerivedData.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/com.apple.dt.Xcode
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('AppNew/ThreeOneOSFive.xcodeproj/project.pbxproj', 'AppNew/ThreeOneOSFive/**/*.swift', 'AppNew/ThreeOneOSFive/**/*.m', 'AppNew/ThreeOneOSFive/**/*.c', 'AppNew/ThreeOneOSFive/**/*.h', 'AppNew/ThreeOneOSFive/Info.plist') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      # Gen branding trước khi build: file này được tạo động từ gen_branding.py
      # (giải mã XOR-encoded brand strings) để tránh hard-code plaintext trong
      # repo. Dùng --out-dir để trỏ vào AppNew (project con).
      # Nếu script fail hoặc generate ra file rỗng → fail build ngay.
      - name: Generate AppBranding.swift
        run: |
          set -euo pipefail
          python3 tools/gen_branding.py --out-dir AppNew/ThreeOneOSFive/helpers
          BRAND_FILE="AppNew/ThreeOneOSFive/helpers/AppBranding.swift"

          # File phải tồn tại và không rỗng.
          if [ ! -s "$BRAND_FILE" ]; then
            echo "::error::AppBranding.swift was not generated or is empty"
            exit 1
          fi

          # Plaintext brand không được xuất hiện trong file generated.
          # Nếu script sinh nhầm plaintext thì fail build ngay.
          if grep -q "ProxyIPA OB55" "$BRAND_FILE"; then
            echo "::error::Plaintext brand leaked into AppBranding.swift"
            exit 1
          fi

          # Đếm tuple entries: phải khớp với số brand strings × số locales (5 × 3 = 15).
          ENTRY_COUNT=$(grep -cE '^\s*\("[a-zA-Z]+",' "$BRAND_FILE" || true)
          if [ "$ENTRY_COUNT" != "15" ]; then
            echo "::error::Expected 15 entries (5 strings × 3 locales), found $ENTRY_COUNT"
            exit 1
          fi

          # Mỗi tuple literal phải kết thúc bằng dấu phẩy — nếu không Swift
          # compiler báo "expected ',' separator".
          BAD_TUPLES=$(grep -E '^\s*\("[a-zA-Z]+",.*\]\)$' "$BRAND_FILE" || true)
          if [ -n "$BAD_TUPLES" ]; then
            echo "::error::Found tuple without trailing comma — Swift will fail to compile:"
            echo "$BAD_TUPLES"
            exit 1
          fi

          echo "AppBranding.swift generated OK ($(wc -c < "$BRAND_FILE") bytes, $ENTRY_COUNT entries)"

      # Build archive (universal iOS, không sign — sẽ sign ở bước sau nếu cần).
      # Scheme shared nằm trong AppNew/ThreeOneOSFive.xcodeproj/xcshareddata/xcschemes/.
      # PRODUCT_NAME = "ProxyVipVn" trong pbxproj → .app bundle ra tên ProxyVipVn.app
      # (đã khớp với CFBundleDisplayName trong Info.plist).
      # CODE_SIGNING_ALLOWED=NO → build unsigned, dùng cho test/preview.
      - name: Build archive
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project AppNew/ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ProxyVipVn.xcarchive \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      # Đóng gói IPA từ .app trong archive. Cấu trúc IPA chuẩn:
      #   Payload/ProxyVipVn.app
      #   Payload/ProxyVipVn.app/Info.plist
      #   ...
      - name: Package IPA
        id: package
        run: |
          set -euo pipefail
          APP_DIR="build/ProxyVipVn.xcarchive/Products/Applications/ProxyVipVn.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "::error::App bundle not found. Available apps:"
            ls -la build/ProxyVipVn.xcarchive/Products/Applications/
            exit 1
          fi

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -r "$APP_DIR" build/ipa/Payload/

          cd build/ipa
          zip -qr ProxyVipVn.ipa Payload
          cd "$GITHUB_WORKSPACE"

          # Verify IPA hợp lệ: phải có Payload/ProxyVipVn.app/Info.plist
          unzip -l build/ipa/ProxyVipVn.ipa | head -30
          unzip -l build/ipa/ProxyVipVn.ipa | grep -q "Payload/ProxyVipVn.app/Info.plist" \
            || { echo "::error::Invalid IPA structure"; exit 1; }

          IPA_SIZE=$(stat -f%z build/ipa/ProxyVipVn.ipa)
          echo "IPA size: $IPA_SIZE bytes"
          echo "ipa_path=build/ipa/ProxyVipVn.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyVipVn-ipa
          path: build/ipa/ProxyVipVn.ipa
          if-no-files-found: error
          retention-days: 14

      # Log size của .app + danh sách binary architectures để debug nhanh
      # nếu IPA fail trên thiết bị thật (vd. "requires arm64, found x86_64").
      - name: Inspect binary
        if: always()
        run: |
          APP_DIR="build/ProxyVipVn.xcarchive/Products/Applications/ProxyVipVn.app"
          if [ -d "$APP_DIR" ]; then
            echo "=== App bundle size ==="
            du -sh "$APP_DIR"
            echo "=== Mach-O architectures ==="
            lipo -info "$APP_DIR/ProxyVipVn" || true
            echo "=== Linked frameworks ==="
            otool -L "$APP_DIR/ProxyVipVn" | head -20
          fi
