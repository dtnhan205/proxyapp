name: Build ProxyVipVn

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate AppBranding.swift (XOR-encoded brand strings)
        run: |
          set -euo pipefail
          python3 tools/gen_branding.py
          # Sanity-check: file phải tồn tại và có chứa hex byte (không rỗng).
          if [ ! -s ThreeOneOSFive/helpers/AppBranding.swift ]; then
            echo "AppBranding.swift was not generated or is empty"; exit 1
          fi
          # Plaintext "ProxyVipVn" không được tồn tại trong file generated.
          # Nếu script sinh nhầm plaintext thì fail build ngay.
          if grep -q "ProxyVipVn V2" ThreeOneOSFive/helpers/AppBranding.swift; then
            echo "Plaintext brand leaked into AppBranding.swift — check gen_branding.py"; exit 1
          fi
          # Đếm tuple entries: phải khớp với số brand strings × số locales (5 × 3 = 15).
          # Mỗi entry phải kết thúc bằng `,` nếu không phải entry cuối của locale block.
          ENTRY_COUNT=$(grep -cE '^\s*\("[a-zA-Z]+",' ThreeOneOSFive/helpers/AppBranding.swift || true)
          if [ "$ENTRY_COUNT" != "15" ]; then
            echo "Expected 15 entries (5 strings × 3 locales), found $ENTRY_COUNT"; exit 1
          fi
          # Mỗi tuple trong array literal PHẢI kết thúc bằng dấu phẩy, nếu không
          # Swift compiler báo "expected ',' separator" (đã từng xảy ra khi gen
          # quên trailing comma). Tìm các dòng chứa tuple literal hex-array
          # (bắt đầu bằng `("` và có `[0x` ở giữa) kết thúc bằng `])` — đây là
          # entry THIẾU trailing comma. Bỏ qua dòng typealias `(String, [UInt8], [UInt8])`.
          BAD_TUPLES=$(grep -E '^\s*\("[a-zA-Z]+",.*\]\)$' ThreeOneOSFive/helpers/AppBranding.swift || true)
          if [ -n "$BAD_TUPLES" ]; then
            echo "Found tuple without trailing comma — Swift will fail to compile:"
            echo "$BAD_TUPLES"
            exit 1
          fi
          echo "AppBranding.swift generated OK ($(wc -c < ThreeOneOSFive/helpers/AppBranding.swift) bytes, $ENTRY_COUNT entries)"

      - name: Archive (no signing)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ProxyVipVn \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ProxyVipVn.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA (Payload/ProxyVipVn.app structure)
        run: |
          set -euo pipefail
          APP_DIR="build/ProxyVipVn.xcarchive/Products/Applications/ProxyVipVn.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "App bundle not found. Listing available apps:"
            ls build/ProxyVipVn.xcarchive/Products/Applications/
            exit 1
          fi
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -r "$APP_DIR" build/ipa/Payload/
          cd build/ipa
          zip -r ProxyVipVn.ipa Payload
          ls -la
          echo "---"
          unzip -l ProxyVipVn.ipa | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyVipVn-ipa
          path: build/ipa/ProxyVipVn.ipa
          if-no-files-found: error
