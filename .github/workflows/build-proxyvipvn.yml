name: Build ProxyVipVn

on:
  workflow_dispatch:

# Cancel các run cũ khi push lại — tránh build trùng.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # DerivedData cache: giảm build time từ ~5 phút (cold) xuống ~1-2 phút
      # (warm) bằng cách cache giữa các run. Key dựa trên hash của:
      #   - .xcodeproj/project.pbxproj (mọi build setting thay đổi → re-cache)
      #   - toàn bộ source files (Hash của source → đảm bảo cache invalidate
      #     khi code thay đổi)
      # Cache lưu trong ~/Library/Developer/Xcode/DerivedData với key dài.
      # Nếu project thay đổi → cache miss → build cold → cache warm cho lần sau.
      #
      # Lưu ý: cache lưu giữa các run cùng branch. Khi switch branch / tag mới
      # mà hash khác, cache tự động miss.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/com.apple.dt.Xcode
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('ThreeOneOSFive.xcodeproj/project.pbxproj', 'ThreeOneOSFive/**/*.swift', 'ThreeOneOSFive/**/*.m', 'ThreeOneOSFive/**/*.c', 'ThreeOneOSFive/**/*.h', 'ThreeOneOSFive/Info.plist') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Generate AppBranding.swift (XOR-encoded brand strings)
        run: |
          set -euo pipefail
          python3 tools/gen_branding.py
          # Sanity-check: file phải tồn tại và có chứa hex byte (không rỗng).
          if [ ! -s ThreeOneOSFive/helpers/AppBranding.swift ]; then
            echo "AppBranding.swift was not generated or is empty"; exit 1
          fi
          # Plaintext "ProxyVipVn" không được tồn tại trong file generated.
          # Nếu script sinh nhầm plaintext thì fail build ngay.
          if grep -q "ProxyVipVn V2" ThreeOneOSFive/helpers/AppBranding.swift; then
            echo "Plaintext brand leaked into AppBranding.swift — check gen_branding.py"; exit 1
          fi
          # Đếm tuple entries: phải khớp với số brand strings × số locales (5 × 3 = 15).
          # Mỗi entry phải kết thúc bằng `,` nếu không phải entry cuối của locale block.
          ENTRY_COUNT=$(grep -cE '^\s*\("[a-zA-Z]+",' ThreeOneOSFive/helpers/AppBranding.swift || true)
          if [ "$ENTRY_COUNT" != "15" ]; then
            echo "Expected 15 entries (5 strings × 3 locales), found $ENTRY_COUNT"; exit 1
          fi
          # Mỗi tuple trong array literal PHẢI kết thúc bằng dấu phẩy, nếu không
          # Swift compiler báo "expected ',' separator" (đã từng xảy ra khi gen
          # quên trailing comma). Tìm các dòng chứa tuple literal hex-array
          # (bắt đầu bằng `("` và có `[0x` ở giữa) kết thúc bằng `])` — đây là
          # entry THIẾU trailing comma. Bỏ qua dòng typealias `(String, [UInt8], [UInt8])`.
          BAD_TUPLES=$(grep -E '^\s*\("[a-zA-Z]+",.*\]\)$' ThreeOneOSFive/helpers/AppBranding.swift || true)
          if [ -n "$BAD_TUPLES" ]; then
            echo "Found tuple without trailing comma — Swift will fail to compile:"
            echo "$BAD_TUPLES"
            exit 1
          fi
          echo "AppBranding.swift generated OK ($(wc -c < ThreeOneOSFive/helpers/AppBranding.swift) bytes, $ENTRY_COUNT entries)"

      # Compile module cache: cache thư mục ModuleCache để swiftc không phải
      # re-parse Swift stdlib + các SDK system modules mỗi run. Đây là 1 phần
      # lớn thời gian build Swift đầu tiên.
      - name: Build (with module cache)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ProxyVipVn \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ProxyVipVn.xcarchive \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA (Payload/ProxyVipVn.app structure)
        run: |
          set -euo pipefail
          APP_DIR="build/ProxyVipVn.xcarchive/Products/Applications/ProxyVipVn.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "App bundle not found. Listing available apps:"
            ls build/ProxyVipVn.xcarchive/Products/Applications/
            exit 1
          fi
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -r "$APP_DIR" build/ipa/Payload/
          cd build/ipa
          zip -r ProxyVipVn.ipa Payload
          ls -la
          echo "---"
          unzip -l ProxyVipVn.ipa | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyVipVn-ipa
          path: build/ipa/ProxyVipVn.ipa
          if-no-files-found: error
